myst: v1
kind: typst
title: Journla of Digital History Template
description: Journal of Digital History Template
template: template.typ
files:
  - template.typ
  - jdh.typ
  - jdh-frontmatter.typ
  - logo-text.svg
  - font-paths.txt
  - fonts/fira_code/FiraCode-Regular.ttf
  - fonts/fira_code/OFL.txt
authors:
  - name: Steve Purves
    github: stevejpurves
    affiliations:
      - Curvenote
version: 0.0.1
license: MIT
tags:
  - article
  - paper
thumbnail: ./thumbnail.png
github: https://github.com/curvenote/jdh-pdf
doc:
  - id: title
    required: true
  - id: authors
    required: true
  - id: subtitle
  - id: short_title
  - id: open_access
  - id: keywords
  - id: date
  - id: doi
  - id: license
  - id: venue
  - id: github
  - id: first_page
options:
  - id: qr_code
    type: file
    description: Path to a QR code image to render in the sidebar.
  - id: fingerprint
    type: file
    description: Path to a fingerprint image to render in the sidebar.
  - id: article_url
    type: string
    description: The article's page on the JDH website, printed in the sidebar (set by jdh-cli).
  - id: forthcoming
    type: boolean
    description: Print "Forthcoming" instead of a publication date (set by jdh-cli when the JDH API has no date).
  - id: figure_placement
    type: choice
    choices:
      - none
      - auto
    default: none
    description: '"none" keeps figures where they are in the text; "auto" floats them to the top or bottom of a page (jdh-cli build --figure-placement).'
parts:
  - id: abstract
    description: >
      An abstract is a short summary of your research paper or report.
    max_words: 500
